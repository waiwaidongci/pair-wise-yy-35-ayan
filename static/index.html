<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>职业辐射剂量与异常事件</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}.stats{display:flex;gap:1rem;margin:1rem 0}.stat{flex:1;background:#f4f7f9;border-radius:8px;padding:1rem;text-align:center}.stat b{display:block;font-size:2rem}</style></head><body><h1>职业辐射剂量与异常事件</h1><p>合并监测读数，比较历史剂量并管理超限调查、医学随访与报告期限</p><p>剂量与调查水平之比决定升级程度，超过阈值必须进入调查；更正剂量不能覆盖已确认审计记录。</p><p>暴露人员台账按员工号登记剂量、通知方式与随访需求；需随访未预约或超调查水平未确认时事件不能关闭；严重度调整后原确认作废并按新档重通知。</p><div class="stats"><div class="stat"><b id="pendingNotify">-</b>待通知人员（人）</div><div class="stat"><b id="pendingFollowUp">-</b>待随访人员（人）</div></div><button onclick="loadAll()">刷新列表</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function loadAll(){const h={'X-Actor':'demo','X-Role':'viewer'};const s=await (await fetch('/api/exposures/summary',{headers:h})).json();document.getElementById('pendingNotify').textContent=s.pending_notifications;document.getElementById('pendingFollowUp').textContent=s.pending_followups;const r=await fetch('/api/items',{headers:h});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}loadAll()</script></body></html>
